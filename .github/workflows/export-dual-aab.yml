name: Export Dual Android AABs

on:
  pull_request:
    paths:
      - '.github/workflows/export-dual-aab.yml'
      - 'editions.json'
      - 'scanner.html'
      - 'index.html'
      - 'sales.html'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'manifest.webmanifest'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        edition: [scanner, pro]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Build selected web edition
        run: npm run build:${{ matrix.edition }}
      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Configure Android release values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          variables = Path('android/variables.gradle')
          text = variables.read_text()
          text = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          text = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          variables.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          text = re.sub(r'versionCode\s+\d+', 'versionCode 4', text)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.4.0"', text)
          app.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          camera = '<uses-permission android:name="android.permission.CAMERA" />'
          if camera not in text:
              text = text.replace('<application', camera + '\n\n    <application', 1)
          manifest.write_text(text)
          PY
      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Verify bundle
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: proservices-${{ matrix.edition }}-v0.4-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
