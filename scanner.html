<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a7661" />
  <meta name="description" content="Escáner rápido de códigos QR y barras de ProServices." />
  <title>QR & Barcode Scanner</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-main" style="max-width:760px;margin:0 auto;padding:24px">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px">
      <div><p class="eyebrow">PROSERVICES</p><h1 style="margin:.2rem 0">QR & Barcode Scanner</h1><p>Escanea, abre, copia y comparte códigos rápidamente.</p></div>
    </header>

    <section class="panel" style="padding:20px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <button id="start-scan-button" class="button button-primary" type="button">Abrir cámara</button>
        <button id="stop-scan-button" class="button button-secondary" type="button" hidden>Detener</button>
        <button id="image-button" class="button button-secondary" type="button">Escanear imagen</button>
        <input id="image-input" type="file" accept="image/*" hidden />
      </div>
      <video id="scanner-video" playsinline muted style="width:100%;border-radius:16px;background:#06110e;min-height:240px" hidden></video>
      <p id="camera-message" role="status">Listo para escanear.</p>
    </section>

    <section class="panel" style="padding:20px;margin-top:18px">
      <h2>Resultado</h2>
      <p id="result-format" class="eyebrow">SIN LECTURA</p>
      <p id="result-value" style="font-size:1.1rem;word-break:break-word">Todavía no hay un código leído.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="copy-button" class="button button-secondary" type="button" disabled>Copiar</button>
        <button id="share-button" class="button button-secondary" type="button" disabled>Compartir</button>
        <a id="open-link" class="button button-primary" href="#" target="_blank" rel="noopener noreferrer" hidden>Abrir enlace</a>
      </div>
    </section>

    <section class="panel" style="padding:20px;margin-top:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2>Historial</h2><button id="clear-history" class="button button-secondary button-small" type="button">Borrar</button></div>
      <div id="history-list"></div>
      <p id="history-empty">Aún no hay lecturas.</p>
    </section>

    <footer style="padding:28px 0;text-align:center"><a href="privacy.html">Privacidad</a> · <a href="support.html">Soporte</a> · <a href="terms.html">Términos</a></footer>
  </main>
  <script type="module" src="src/scanner-app.js"></script>
</body>
</html>
